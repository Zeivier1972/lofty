[build]

[deploy]
preDeployCommand = "node scripts/db-migrate.js"
startCommand = "./node_modules/.bin/next start -H 0.0.0.0"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[crons]]
name = "sofia-match-alerts"
schedule = "0 * * * *"
command = "curl -sf -X POST ${NEXT_PUBLIC_APP_URL}/api/cron/match-alerts -H \"x-cron-secret: ${CRON_SECRET}\" || true"

[[crons]]
name = "daily-system-check"
schedule = "0 8 * * *"
command = "curl -sf \"${NEXT_PUBLIC_APP_URL}/api/cron/system-check\" -H \"x-cron-secret: ${CRON_SECRET}\" || true"

# Smart Plan engine — sends due drip steps (email/SMS/WhatsApp/tasks) hourly.
# The executor route existed but NOTHING called it, so enrolled plans never ran.
# NOTE: the route is GET-only and expects Authorization: Bearer.
[[crons]]
name = "smart-plans-engine"
schedule = "30 * * * *"
command = "curl -sf \"${NEXT_PUBLIC_APP_URL}/api/cron/smart-plans\" -H \"Authorization: Bearer ${CRON_SECRET}\" || true"

# Warm→Hot rollout pacing — daily at 14:00 UTC (~9-10 AM ET): expires stale
# call tasks (3 days), releases the next batch of QUEUED Warm enrollments only
# if Catherine's open task queue is below the cap, and builds her daily call
# digest. Pace/cap via WARM_RELEASE_PER_DAY (30) and WARM_TASK_CAP (40).
[[crons]]
name = "warm-plan-release"
schedule = "0 14 * * *"
command = "curl -sf -X POST ${NEXT_PUBLIC_APP_URL}/api/cron/warm-plan-release -H \"x-cron-secret: ${CRON_SECRET}\" || true"

# Sofía follows up with hot buyers (3+ saves/views) once daily — one short nudge
# that offers more homes + drives to a call/appointment with Catherine. Cost-
# controlled (once per lead / 3 days, capped per run, SMS via the automated path
# so the monthly cap + kill switch apply). 16:00 UTC ≈ noon ET.
[[crons]]
name = "hot-buyer-followup"
schedule = "0 16 * * *"
command = "curl -sf \"${NEXT_PUBLIC_APP_URL}/api/cron/hot-buyer-followup\" -H \"x-cron-secret: ${CRON_SECRET}\" || true"

# ─────────────────────────────────────────────────────────────────────────────
# TWO SCHEDULERS RUN IN THIS PROJECT. Read instrumentation.ts before adding
# anything here.
#
# `instrumentation.ts` registers node-cron schedules in-process at server
# startup (next.config.js sets experimental.instrumentationHook). It already
# drives: calls (*/15), social-autopilot morning 13:00 / evening 22:00 / check
# hourly, soi-check hourly, score-decay hourly, event-reminders 14:00,
# smart-plans hourly, system-check */20 + 12:00, and the MLS sync.
#
# The entries in THIS file cover the jobs that scheduler does not: match-alerts,
# warm-plan-release, hot-buyer-followup — plus the two below, which nothing
# called at all.
#
# A job scheduled in both places runs twice. For some that is harmless
# (smart-plans is due-based, system-check only reports) and the two above have
# been doubled for a while. For others it is not: a second social-autopilot slot
# can post to Facebook and Instagram twice.
#
# Times are UTC; Miami is UTC-4 (EDT) / UTC-5 (EST), so a UTC hour reads ~4-5
# hours earlier locally.
# ─────────────────────────────────────────────────────────────────────────────

# Saved-search alerts — one email per active saved search when new listings
# match, linking to a pre-filtered /homes through the click tracker so Sofía
# knows who arrived. One email per person per run regardless of how many
# listings matched. Genuinely had no caller: not in instrumentation.ts, not
# here. 12:47 UTC ≈ 8:47 AM ET.
[[crons]]
name = "saved-search-alerts"
schedule = "47 12 * * *"
command = "curl -sf \"${NEXT_PUBLIC_APP_URL}/api/cron/saved-search-alerts\" -H \"Authorization: Bearer ${CRON_SECRET}\" || true"

# Nightly pre-construction scrape into the Setting row the admin page reads.
# Also had no scheduled caller. Needs Chromium on the Railway image; if it is
# missing the route logs that and returns the error rather than failing the
# deploy. 06:25 UTC ≈ 2:25 AM ET.
[[crons]]
name = "scrape-preconstruction"
schedule = "25 6 * * *"
command = "curl -sf \"${NEXT_PUBLIC_APP_URL}/api/cron/scrape-preconstruction\" -H \"Authorization: Bearer ${CRON_SECRET}\" || true"

# Webinar sequence: creates the Zoom meeting for anything starting within 3
# days, sends the 1-day / 1-hour / "we're live" reminders, and 30 minutes after
# the end sends the follow-up split by what each person actually did — watched
# past 60% gets asked for a 1:1, a no-show gets the replay. Every 15 minutes
# because the 1-hour and at-start windows are too tight for a daily job; a
# `lastStage` on each registration is what stops a second run re-sending.
[[crons]]
name = "webinar-reminders"
schedule = "2,17,32,47 * * * *"
command = "curl -sf \"${NEXT_PUBLIC_APP_URL}/api/cron/webinar-reminders\" -H \"Authorization: Bearer ${CRON_SECRET}\" || true"
